<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    .stage {
        position: relative;
        height: 100%;
        border-radius: 18px;
        overflow: hidden;
        background:
            radial-gradient(circle at 80% 15%, rgba(77, 208, 225, 0.30), transparent 50%),
            linear-gradient(135deg, #0a2a66 0%, #0d47a1 55%, #00838f 100%);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
        background-size: 24px 24px;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .caption {
        position: absolute;
        top: 12px;
        left: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        color: #ffffff;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .caption .live {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4dd0e1;
        animation: blink 1.4s ease-in-out infinite;
    }
    .legend {
        position: absolute;
        bottom: 10px;
        left: 14px;
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: #b2ebf2;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4dd0e1; box-shadow: 0 0 6px #4dd0e1; }
    .ring { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #b0bec5; }
    @keyframes blink { 50% { opacity: 0.25; } }
</style>
</head>
<body>
<div class="stage">
    <canvas id="c"></canvas>
    <div class="caption"><span class="live"></span>__CAPTION__</div>
    <div class="legend">
        <span><i class="dot"></i>__CLUSTER__</span>
        <span><i class="ring"></i>__NOISE__</span>
    </div>
</div>
<script>
(() => {
    const COLORS = ["#4dd0e1", "#90caf9", "#ffb74d"];
    const NOISE = "#b0bec5";
    const N_POINTS = 72;
    const CYCLE = 9000;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let W = 0, H = 0, eps = 0;
    let points = [];
    let centers = [];
    let cycleStart = performance.now();

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = canvas.clientWidth;
        H = canvas.clientHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        eps = Math.min(W, H) * 0.16;
    }

    const rand = (a, b) => a + Math.random() * (b - a);
    const randomSpot = () => ({ x: rand(14, W - 14), y: rand(40, H - 34) });
    const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const clamp01 = t => Math.max(0, Math.min(1, t));
    const phase = (t, a, b) => clamp01((t - a) / (b - a));

    function gaussian() {
        let u = 0, v = 0;
        while (!u) u = Math.random();
        while (!v) v = Math.random();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    function pickCenters() {
        const result = [];
        const margin = eps * 0.9;
        for (let tries = 0; result.length < 3 && tries < 500; tries++) {
            const c = { x: rand(margin, W - margin), y: rand(margin + 44, H - margin - 10) };
            if (result.every(o => Math.hypot(o.x - c.x, o.y - c.y) > eps * 2.1)) result.push(c);
        }
        return result;
    }

    // Cada ciclo: posição espalhada (from) -> alvo agrupado (to) -> nova posição espalhada (exit)
    function newScene() {
        centers = pickCenters();
        points = Array.from({ length: N_POINTS }, (_, i) => {
            const prev = points[i];
            const from = prev ? prev.exit : randomSpot();
            const isNoise = Math.random() < 0.22 || !centers.length;
            const cluster = isNoise ? -1 : Math.floor(Math.random() * centers.length);
            let to;
            if (isNoise) {
                // Ruído fica fora do raio de qualquer cluster
                let tries = 0;
                do { to = randomSpot(); }
                while (++tries < 50 && centers.some(c => Math.hypot(c.x - to.x, c.y - to.y) < eps * 1.15));
            } else {
                const c = centers[cluster];
                const spread = eps * 0.38;
                to = {
                    x: c.x + Math.max(-eps * 0.85, Math.min(eps * 0.85, gaussian() * spread)),
                    y: c.y + Math.max(-eps * 0.85, Math.min(eps * 0.85, gaussian() * spread)),
                };
            }
            return { from, to, exit: randomSpot(), cluster, wobble: Math.random() * Math.PI * 2 };
        });
    }

    function hexToRgba(hex, a) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
    }

    function draw(now) {
        let t = reduceMotion ? 5500 : now - cycleStart;
        if (t >= CYCLE) {
            newScene();
            cycleStart = now;
            t = 0;
        }

        const gather = ease(phase(t, 1200, 3400));   // pontos se aproximam
        const reveal = ease(phase(t, 3300, 4200));   // clusters ganham cor e raio
        const scatter = ease(phase(t, 7600, CYCLE)); // pontos se espalham de novo
        const visible = reveal * (1 - scatter);

        ctx.clearRect(0, 0, W, H);

        const pos = points.map(p => {
            const drift = (1 - gather + scatter) * 3;
            const x = p.from.x + (p.to.x - p.from.x) * gather + (p.exit.x - p.to.x) * scatter;
            const y = p.from.y + (p.to.y - p.from.y) * gather + (p.exit.y - p.to.y) * scatter;
            return {
                x: x + Math.sin(now / 900 + p.wobble) * drift,
                y: y + Math.cos(now / 1100 + p.wobble) * drift,
            };
        });

        // Raio eps pulsando em volta de cada cluster
        centers.forEach((c, i) => {
            if (visible <= 0) return;
            const pulse = 1 + Math.sin(now / 500 + i) * 0.05;
            const r = eps * pulse * (0.6 + 0.4 * reveal);
            ctx.beginPath();
            ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
            ctx.fillStyle = hexToRgba(COLORS[i], 0.10 * visible);
            ctx.fill();
            ctx.setLineDash([4, 5]);
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = hexToRgba(COLORS[i], 0.65 * visible);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.font = "10px ui-monospace, Menlo, monospace";
            ctx.fillStyle = hexToRgba(COLORS[i], 0.95 * visible);
            ctx.textAlign = "center";
            ctx.fillText(`C${i + 1}`, c.x, c.y - r - 6);
        });

        // Ligações entre vizinhos do mesmo cluster (alcance de densidade)
        if (visible > 0) {
            ctx.lineWidth = 0.8;
            for (let i = 0; i < points.length; i++) {
                if (points[i].cluster < 0) continue;
                for (let j = i + 1; j < points.length; j++) {
                    if (points[j].cluster !== points[i].cluster) continue;
                    const d = Math.hypot(pos[i].x - pos[j].x, pos[i].y - pos[j].y);
                    if (d < eps * 0.45) {
                        ctx.strokeStyle = hexToRgba(COLORS[points[i].cluster], 0.35 * visible * (1 - d / (eps * 0.45)));
                        ctx.beginPath();
                        ctx.moveTo(pos[i].x, pos[i].y);
                        ctx.lineTo(pos[j].x, pos[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Casos
        points.forEach((p, i) => {
            const { x, y } = pos[i];
            if (p.cluster < 0) {
                ctx.beginPath();
                ctx.arc(x, y, 2.6, 0, Math.PI * 2);
                ctx.lineWidth = 1.3;
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.75 - 0.25 * visible})`;
                ctx.stroke();
                return;
            }
            const color = COLORS[p.cluster];
            ctx.beginPath();
            ctx.arc(x, y, 3 + visible * 0.6, 0, Math.PI * 2);
            ctx.shadowBlur = 10 * visible;
            ctx.shadowColor = color;
            ctx.fillStyle = visible > 0 ? hexToRgba(color, 0.35 + 0.65 * visible) : "rgba(255, 255, 255, 0.8)";
            if (visible > 0 && visible < 1) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                ctx.fill();
                ctx.fillStyle = hexToRgba(color, visible);
            }
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        if (!reduceMotion) requestAnimationFrame(draw);
    }

    resize();
    newScene();
    window.addEventListener("resize", () => { resize(); newScene(); });
    requestAnimationFrame(draw);
})();
</script>
</body>
</html>
